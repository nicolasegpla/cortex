[build]
  base = "cortex-frontend"
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: React Router handles all client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache hashed assets indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
