services:
  frontend:
    build:
      context: ./cortex-frontend
      dockerfile: Dockerfile
    working_dir: /app
    command: pnpm run dev
    ports:
      - '5173:5173'
    volumes:
      - ./cortex-frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./cortex-frontend/.env
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./cortex-backend
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - '8000:8000'
    volumes:
      - ./cortex-backend:/app
    env_file:
      - ./cortex-backend/.env
    environment:
      APP_ENV: development
      CORS_ORIGINS: http://localhost:5173

volumes:
  frontend_node_modules:
