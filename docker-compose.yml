services:
  frontend:
    build:
      context: ./cortex-frontend
      dockerfile: Dockerfile
    working_dir: /app
    command: pnpm run dev
    ports:
      - '5173:5173'
    volumes:
      - ./cortex-frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ./cortex-frontend/.env
    depends_on:
      - backend

  backend:
    build:
      context: ./cortex-backend
      dockerfile: Dockerfile
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - '8000:8000'
    volumes:
      - ./cortex-backend:/app
    env_file:
      - ./cortex-backend/.env

volumes:
  frontend_node_modules:
