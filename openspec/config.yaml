# OpenSpec Config — cortex

## Project

- name: cortex
- type: hybrid fullstack (React + FastAPI)
- artifact_store: both

## Context

Cortex is a reusable single-tenant application base for delivering client-specific business flows. Phase-1 scope: web-first UI, FastAPI backend, Supabase data layer, strict TDD. First initiative: chat-first multi-provider LLM workspace with secure API-key management. Initial providers: Kimi, OpenAI, Minimax, Anthropic.

## Strict TDD

- enabled: true
- reason: test runner present on both frontend (vitest) and backend (pytest); project convention (CORTEX.md Rule 1)

